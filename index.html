<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>赤飯・もち算出計算機</title>
<meta name="description" content="赤飯・もちの必要材料とせいろ数を算出するPWAアプリ" />
<meta name="theme-color" content="#c0392b" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="赤飯もち算出" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="app-header">
  <h1>赤飯・もち算出計算機</h1>
  <button id="install-btn" class="install-btn" hidden>ホーム画面に追加</button>
</header>

<nav class="tabs" role="tablist" aria-label="機能タブ">
  <button class="tab-btn is-active" data-tab="sekihan" role="tab" aria-selected="true">赤飯</button>
  <button class="tab-btn" data-tab="mochi" role="tab" aria-selected="false">もち</button>
  <button class="tab-btn" data-tab="ingredients" role="tab" aria-selected="false">原材料算出</button>
  <button class="tab-btn" data-tab="products" role="tab" aria-selected="false">商品一覧</button>
</nav>

<main id="app"></main>

<footer class="app-footer">
  <p>入力内容はこの端末に自動保存されます。</p>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
